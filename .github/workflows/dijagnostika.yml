name: Dijagnostika rasporeda

on:
  push:
    branches:
      - sync-google-sheet-2026-08-25
    paths:
      - ".github/workflows/dijagnostika.yml"
      - "ulazi/**/*.csv"
      - "src/resavac.py"
      - "src/loader.py"
      - "src/model.py"

permissions:
  contents: read

jobs:
  dijagnostika:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Izoluj subotnji konflikt po vrsti nastave
        run: |
          python - <<'PY'
          from collections import defaultdict
          from src.resavac import ucitaj_standardne_ulaze, resi_obe_nedelje
          from src.model import Skola

          ulaz, prostorije, sve = ucitaj_standardne_ulaze('ulazi')
          subota = tuple(x for x in sve if x.dan == 'субота')
          subota_osobe = {x.nastavnik for x in subota}

          def status(label, nedostupnosti, limit=30):
              a, b = resi_obe_nedelje(
                  ulaz, prostorije, nedostupnosti,
                  vremensko_ogranicenje=limit,
                  broj_radnika=8,
                  seme=1,
                  hintovi=(),
              )
              print(f'{label}: A={a.status}; B={b.status}; n={len(nedostupnosti)}', flush=True)
              return a.status

          kategorije = defaultdict(set)
          for z in ulaz.zahtevi:
              if z.nastavnik not in subota_osobe:
                  continue
              odeljenja = [ulaz.odeljenja[o] for o in z.odeljenja]
              if not odeljenja:
                  continue
              predmet = ulaz.predmeti[z.predmet]
              if all(o.skola is Skola.OSNOVNA for o in odeljenja):
                  kategorije['OBS'].add(z.nastavnik)
              elif all(o.skola is Skola.SREDNJA for o in odeljenja):
                  if not predmet.igracki:
                      kategorije['OO'].add(z.nastavnik)
                  elif all(o.oznaka.rstrip('АБ')[-1] == '5' for o in odeljenja):
                      kategorije['NI'].add(z.nastavnik)
                  else:
                      kategorije['KBSI'].add(z.nastavnik)

          for kat in ('OBS', 'OO', 'NI', 'KBSI'):
              osobe = sorted(kategorije[kat])
              print(kat + ' SUBOTOM NEDOSTUPNI (' + str(len(osobe)) + '): ' + ', '.join(osobe), flush=True)

          status('SAMO SUBOTA - SVI', subota)
          for kat in ('OBS', 'OO', 'NI', 'KBSI'):
              osobe = kategorije[kat]
              nd = tuple(x for x in subota if x.nastavnik in osobe)
              status('SAMO SUBOTA - ' + kat, nd, limit=35)

          # I komplementarne probe: iz punog skupa subotnjih zabrana ukloni
          # celu kategoriju da vidimo koja kategorija otključava model.
          for kat in ('OBS', 'OO', 'NI', 'KBSI'):
              osobe = kategorije[kat]
              nd = tuple(x for x in subota if x.nastavnik not in osobe)
              status('SUBOTA BEZ ' + kat, nd, limit=35)
          PY
