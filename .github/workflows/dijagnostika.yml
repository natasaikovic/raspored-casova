name: Dijagnostika nedostupnosti

on:
  push:
    branches:
      - sync-google-sheet-2026-08-25
    paths:
      - ".github/workflows/dijagnostika.yml"

permissions:
  contents: read

jobs:
  dijagnostika:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Izoluj konflikt nedostupnosti po danima
        run: |
          python - <<'PY'
          from ortools.sat.python import cp_model
          from src.model import DANI, Smena
          from src.resavac import napravi_model, ucitaj_standardne_ulaze

          ulaz, prostorije, sve = ucitaj_standardne_ulaze("ulazi")

          def status(label, nd, limit=35):
              model, _, _ = napravi_model(
                  ulaz, prostorije, tuple(nd), Smena.CRVENA, (), sa_nedeljom_b=False
              )
              model.clear_objective()
              solver = cp_model.CpSolver()
              solver.parameters.max_time_in_seconds = limit
              solver.parameters.num_search_workers = 8
              solver.parameters.random_seed = 1
              st = solver.solve(model)
              print(f"{label}: {solver.status_name(st)}; n={len(tuple(nd))}; wall={solver.wall_time:.2f}s", flush=True)
              return st

          print("BROJ NEDOSTUPNOSTI PO DANU:", flush=True)
          for dan in DANI:
              print(dan, sum(1 for x in sve if x.dan == dan), flush=True)

          status("SVE", sve, 45)
          for dan in DANI:
              samo = tuple(x for x in sve if x.dan == dan)
              status("SAMO " + dan, samo, 30)
          for dan in DANI:
              bez = tuple(x for x in sve if x.dan != dan)
              status("SVE BEZ " + dan, bez, 40)
          PY
