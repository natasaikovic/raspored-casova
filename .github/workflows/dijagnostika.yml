name: Dijagnostika rasporeda

on:
  push:
    branches:
      - sync-google-sheet-2026-08-25
    paths:
      - ".github/workflows/dijagnostika.yml"

permissions:
  contents: read

jobs:
  dijagnostika:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Privremeno razdvoji OO od strucnih neigrackih predmeta
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/resavac.py')
          tekst = p.read_text(encoding='utf-8')
          stara = """                    cilj = igracki if ulaz.predmeti[zahtev.predmet].igracki else opsti\n                    cilj.append(\n"""
          nova = """                    if ulaz.predmeti[zahtev.predmet].igracki:\n                        cilj = igracki\n                    elif zahtev.predmet in OPSTI_PREDMETI:\n                        cilj = opsti\n                    else:\n                        continue\n                    cilj.append(\n"""
          if stara not in tekst:
              raise SystemExit('Nije pronadjeno mesto za klasifikaciju predmeta')
          konstanta = '''\nOPSTI_PREDMETI = frozenset({\n    "Српски језик и књижевност",\n    "Француски језик",\n    "Енглески језик",\n    "Историја",\n    "Рачунарство и информатика",\n    "Математика",\n    "Биологија",\n    "Психологија",\n    "Социологија",\n    "Филозофија",\n    "Верска настава",\n    "Грађанско васпитање",\n})\n'''
          marker = 'NEPOZNATI_KOREPETITOR = "?"\n'
          tekst = tekst.replace(marker, marker + konstanta, 1).replace(stara, nova, 1)
          p.write_text(tekst, encoding='utf-8')
          PY
      - name: Pokreni solver sa ispravljenom klasifikacijom
        run: |
          python - <<'PY'
          from src.resavac import ucitaj_standardne_ulaze, resi_obe_nedelje
          ulaz, prostorije, nedostupnosti = ucitaj_standardne_ulaze('ulazi')
          a, b = resi_obe_nedelje(
              ulaz, prostorije, nedostupnosti,
              vremensko_ogranicenje=180,
              broj_radnika=8,
              seme=1,
              hintovi=(),
          )
          print(f'ISPRAVLJENA KLASIFIKACIJA: A={a.status}; B={b.status}; casoviA={len(a.casovi)}; casoviB={len(b.casovi)}')
          if a.izvestaj:
              print('GRESKE A:', len(a.izvestaj.greske))
              print('UPOZORENJA A:', len(a.izvestaj.upozorenja))
          PY
