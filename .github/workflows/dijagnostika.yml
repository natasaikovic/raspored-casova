name: Dijagnostika rasporeda

on:
  push:
    branches:
      - sync-google-sheet-2026-08-25
    paths:
      - ".github/workflows/dijagnostika.yml"
      - "ulazi/**/*.csv"
      - "src/resavac.py"
      - "src/loader.py"
      - "src/model.py"

permissions:
  contents: read

jobs:
  dijagnostika:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Izoluj nedostupnosti
        run: |
          python - <<'PY'
          from collections import defaultdict
          from src.resavac import ucitaj_standardne_ulaze, resi_obe_nedelje

          ulaz, prostorije, sve = ucitaj_standardne_ulaze('ulazi')

          def status(label, nedostupnosti, limit=45):
              a, b = resi_obe_nedelje(
                  ulaz, prostorije, nedostupnosti,
                  vremensko_ogranicenje=limit,
                  broj_radnika=8,
                  seme=1,
                  hintovi=(),
              )
              print(f'{label}: A={a.status}; B={b.status}; n={len(nedostupnosti)}', flush=True)
              return a.status

          status('BEZ NEDOSTUPNOSTI', ())
          status('SVE NEDOSTUPNOSTI', sve)

          subota = tuple(x for x in sve if x.dan == 'субота')
          radni = tuple(x for x in sve if x.dan != 'субота')
          status('SAMO SUBOTA', subota)
          status('SAMO PON-PET', radni)

          po_osobi = defaultdict(list)
          for x in sve:
              po_osobi[x.nastavnik].append(x)

          aktivne_osobe = sorted(po_osobi)
          print('BROJ OSOBA SA OGRANICENJIMA:', len(aktivne_osobe), flush=True)

          # Podela na dve polovine daje brz binarni trag ka konfliktu.
          pola = len(aktivne_osobe) // 2
          for label, osobe in [('PRVA POLOVINA', aktivne_osobe[:pola]), ('DRUGA POLOVINA', aktivne_osobe[pola:])]:
              skup = set(osobe)
              nd = tuple(x for x in sve if x.nastavnik in skup)
              status(label, nd)

          # Brza pojedinačna provera osoba sa nesubotnjim ograničenjima.
          kandidati = [ime for ime in aktivne_osobe if any(x.dan != 'субота' for x in po_osobi[ime])]
          print('KANDIDATI SA OGRANICENJIMA PON-PET:', ', '.join(kandidati), flush=True)
          for ime in kandidati:
              nd = tuple(po_osobi[ime])
              status('SAMO ' + ime, nd, limit=20)
          PY
