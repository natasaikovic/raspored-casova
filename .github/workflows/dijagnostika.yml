name: Dijagnostika rasporeda

on:
  push:
    branches:
      - sync-google-sheet-2026-08-25
    paths:
      - ".github/workflows/dijagnostika.yml"
      - "ulazi/**/*.csv"
      - "src/resavac.py"
      - "src/loader.py"
      - "src/model.py"

permissions:
  contents: read

jobs:
  dijagnostika:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Izoluj subotnja ogranicenja
        run: |
          python - <<'PY'
          from collections import defaultdict
          from src.resavac import ucitaj_standardne_ulaze, resi_obe_nedelje
          from src.model import Skola

          ulaz, prostorije, sve = ucitaj_standardne_ulaze('ulazi')
          subota = tuple(x for x in sve if x.dan == 'субота')
          radni = tuple(x for x in sve if x.dan != 'субота')
          subota_osobe = sorted({x.nastavnik for x in subota})

          def status(label, nedostupnosti, limit=45):
              a, b = resi_obe_nedelje(
                  ulaz, prostorije, nedostupnosti,
                  vremensko_ogranicenje=limit,
                  broj_radnika=8,
                  seme=1,
                  hintovi=(),
              )
              print(f'{label}: A={a.status}; B={b.status}; n={len(nedostupnosti)}', flush=True)
              return a.status

          print('SUBOTOM NEDOSTUPNI (' + str(len(subota_osobe)) + '): ' + ', '.join(subota_osobe), flush=True)

          # Koliko igracke nastave srednje skole nosi svaka subotom nedostupna osoba.
          # Odeljenja sa indeksom 1-4 su KB/SI; indeks 5 je NI i po pravilima ne ide subotom.
          fond_kb_si = defaultdict(int)
          detalji = defaultdict(list)
          for z in ulaz.zahtevi:
              if not ulaz.predmeti[z.predmet].igracki:
                  continue
              odeljenja = [ulaz.odeljenja[o] for o in z.odeljenja]
              if not odeljenja or any(o.skola is not Skola.SREDNJA for o in odeljenja):
                  continue
              if not any(o.oznaka.rstrip('АБ')[-1] in '1234' for o in odeljenja):
                  continue
              if z.nastavnik in subota_osobe:
                  fond_kb_si[z.nastavnik] += z.fond
                  detalji[z.nastavnik].append(f'{z.predmet}/{"+".join(z.odeljenja)}={z.fond}')

          kandidati = sorted(fond_kb_si, key=lambda ime: (-fond_kb_si[ime], ime))
          print('SUBOTNJI KANDIDATI PO FONDU KB/SI:', flush=True)
          for ime in kandidati:
              print(f'  {ime}: {fond_kb_si[ime]} :: ' + '; '.join(detalji[ime]), flush=True)

          status('SVE NEDOSTUPNOSTI', sve)
          status('SAMO SUBOTA', subota)
          status('SAMO PON-PET', radni)

          # Proveri da li jedna osoba sama otkljucava model kada joj se dozvoli subota.
          for ime in kandidati[:12]:
              nd = tuple(x for x in sve if not (x.dan == 'субота' and x.nastavnik == ime))
              status('OSLOBODI SUBOTU: ' + ime, nd, limit=35)

          # Ako nije dovoljna jedna osoba, probaj kumulativno najopterecenije.
          for broj in (2, 4, 6, 8, 12):
              oslobodi = set(kandidati[:broj])
              nd = tuple(x for x in sve if not (x.dan == 'субота' and x.nastavnik in oslobodi))
              status('OSLOBODI TOP ' + str(broj), nd, limit=45)
          PY
