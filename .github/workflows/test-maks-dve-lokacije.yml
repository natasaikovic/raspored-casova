name: Test maks dve lokacije

on:
  push:
    branches:
      - sync-google-sheet-2026-08-25
    paths:
      - ".github/workflows/test-maks-dve-lokacije.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dodaj samo pravilo najvise dve lokacije
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/resavac.py')
          t = p.read_text(encoding='utf-8')
          old = '''            model.add(visak_lokacija >= sum(koristi_lokaciju) - 1)\n            kazne.append(300 * visak_lokacija)\n'''
          new = '''            model.add(visak_lokacija >= sum(koristi_lokaciju) - 1)\n            model.add(sum(koristi_lokaciju) <= 2)\n            kazne.append(300 * visak_lokacija)\n'''
          if old not in t:
              raise SystemExit('Nije pronadjeno A pravilo lokacija')
          t = t.replace(old, new, 1)
          old_b = '''                model.add(visak_lokacija_b >= sum(koristi_lokaciju_b) - 1)\n                kazne.append(300 * visak_lokacija_b)\n'''
          new_b = '''                model.add(visak_lokacija_b >= sum(koristi_lokaciju_b) - 1)\n                model.add(sum(koristi_lokaciju_b) <= 2)\n                kazne.append(300 * visak_lokacija_b)\n'''
          if old_b not in t:
              raise SystemExit('Nije pronadjeno B pravilo lokacija')
          t = t.replace(old_b, new_b, 1)
          p.write_text(t, encoding='utf-8')
          PY
      - name: Instaliraj i testiraj
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q
      - name: Proveri strogu dopustivost A+B
        run: |
          python - <<'PY'
          from ortools.sat.python import cp_model
          from src.model import Smena
          from src.resavac import napravi_model, ucitaj_standardne_ulaze
          ulaz, prostorije, nedostupnosti = ucitaj_standardne_ulaze('ulazi')
          model, _, _ = napravi_model(ulaz, prostorije, nedostupnosti, Smena.CRVENA, (), sa_nedeljom_b=True)
          model.clear_objective()
          solver = cp_model.CpSolver()
          solver.parameters.max_time_in_seconds = 240
          solver.parameters.num_search_workers = 8
          solver.parameters.random_seed = 1
          status = solver.solve(model)
          print('STATUS', solver.status_name(status), 'WALL', solver.wall_time)
          if status not in (cp_model.OPTIMAL, cp_model.FEASIBLE):
              raise SystemExit(1)
          PY
      - name: Commituj pravilo ako je dokazano dopustivo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/resavac.py
          git commit -m "Ograniči učenika na najviše dve lokacije dnevno"
          git push origin HEAD:sync-google-sheet-2026-08-25