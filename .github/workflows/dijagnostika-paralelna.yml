name: Paralelna dijagnostika rasporeda

on:
  push:
    branches:
      - sync-google-sheet-2026-08-25
    paths:
      - ".github/workflows/dijagnostika-paralelna.yml"

permissions:
  contents: read

jobs:
  sloj:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [bez, subota, radni, sve]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Proveri scenario
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          python - <<'PY'
          import os
          from src.resavac import ucitaj_standardne_ulaze, resi_obe_nedelje
          ulaz, prostorije, sve = ucitaj_standardne_ulaze('ulazi')
          s = os.environ['SCENARIO']
          if s == 'bez': nd = ()
          elif s == 'subota': nd = tuple(x for x in sve if x.dan == 'субота')
          elif s == 'radni': nd = tuple(x for x in sve if x.dan != 'субота')
          else: nd = sve
          a,b = resi_obe_nedelje(ulaz, prostorije, nd, vremensko_ogranicenje=30, broj_radnika=8, seme=1, hintovi=())
          print(f'SCENARIO={s}; A={a.status}; B={b.status}; N={len(nd)}')
          PY
