name: Primeni pravila resursa v2

on:
  push:
    branches:
      - sync-google-sheet-2026-08-25
    paths:
      - ".github/workflows/primeni-pravila-resursa-v2.yml"

permissions:
  contents: write

jobs:
  primeni:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Primeni pravila korepetitora i Narodnog pozorista
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/resavac.py')
          t = p.read_text(encoding='utf-8')
          t = t.replace(
              'INFORMATIKA = "Рачунарство и информатика"\nNP_SALA = "NP-сала"\n',
              'INFORMATIKA = "Рачунарство и информатика"\nREPERTOAR_KLASICNOG = "Репертоар класичног балета"\nNP_SALA = "NP-сала"\n',
              1,
          )
          old = '''    # NP sala ima veoma usko pravilo. Prva verzija je ne koristi; ostalih deset\n    # sala daju dovoljan kapacitet, a izbegavanje NP znatno smanjuje model.\n    return tuple(p for p in prostorije if p.tip is tip and p.oznaka != NP_SALA)\n'''
          new = '''    if zahtev.predmet == REPERTOAR_KLASICNOG and zahtev.odeljenja[0] in {\n        "III1", "III2", "IV1", "IV2"\n    }:\n        return tuple(p for p in prostorije if p.tip is tip)\n    return tuple(p for p in prostorije if p.tip is tip and p.oznaka != NP_SALA)\n'''
          assert old in t
          t = t.replace(old, new, 1)

          old = '''        if not dozvoljeni:\n            raise ValueError(\n                f"{zahtev.gde}: нема дозвољеног почетка за „{zahtev.predmet}“"\n            )\n'''
          new = '''        if zahtev.korepetitor and jedinica.korepeticija:\n            dozvoljeni = tuple(\n                (dan_i, blok_i)\n                for dan_i, blok_i in dozvoljeni\n                if not _nastavnik_nedostupan(\n                    zahtev.korepetitor, DANI[dan_i],\n                    tuple(blok_i + p for p in jedinica.korepeticija),\n                    nedostupnosti,\n                )\n            )\n        if not dozvoljeni:\n            raise ValueError(\n                f"{zahtev.gde}: нема дозвољеног почетка за „{zahtev.predmet}“"\n            )\n'''
          assert old in t
          t = t.replace(old, new, 1)

          old = '''                vrednosti_starta_b = [\n                    dan_i * KORAK_DANA + blok_i\n                    for dan_i, blok_i in dozvoljeni_b\n                ]\n'''
          new = '''                if zahtev.korepetitor and jedinica.korepeticija:\n                    dozvoljeni_b = tuple(\n                        (dan_i, blok_i)\n                        for dan_i, blok_i in dozvoljeni_b\n                        if not _nastavnik_nedostupan(\n                            zahtev.korepetitor, DANI[dan_i],\n                            tuple(blok_i + p for p in jedinica.korepeticija),\n                            nedostupnosti,\n                        )\n                    )\n                if not dozvoljeni_b:\n                    raise ValueError(\n                        f"{zahtev.gde}: нема дозвољеног почетка у недељи B "\n                        f"за „{zahtev.predmet}“"\n                    )\n                vrednosti_starta_b = [\n                    dan_i * KORAK_DANA + blok_i\n                    for dan_i, blok_i in dozvoljeni_b\n                ]\n'''
          assert old in t
          t = t.replace(old, new, 1)

          old = '''    jedinice_zahteva: dict[int, list[Jedinica]] = defaultdict(list)\n\n    for jedinica in jedinice:\n'''
          new = '''    jedinice_zahteva: dict[int, list[Jedinica]] = defaultdict(list)\n    np_izbori: dict[str, list[cp_model.BoolVar]] = defaultdict(list)\n    ima_np_program = all(\n        any(\n            z.predmet == REPERTOAR_KLASICNOG and oznaka in z.odeljenja\n            for z in ulaz.zahtevi\n        )\n        for oznaka in ("IV1", "IV2")\n    )\n\n    for jedinica in jedinice:\n'''
          assert old in t
          t = t.replace(old, new, 1)

          old = '''            koristi = model.new_bool_var(f"{prefiks}_{prostorija.oznaka}")\n            izbor_prostorije[prostorija.oznaka] = koristi\n            po_lokaciji[prostorija.lokacija].append(koristi)\n'''
          new = '''            koristi = model.new_bool_var(f"{prefiks}_{prostorija.oznaka}")\n            izbor_prostorije[prostorija.oznaka] = koristi\n            po_lokaciji[prostorija.lokacija].append(koristi)\n            if prostorija.oznaka == NP_SALA:\n                np_izbori[zahtev.odeljenja[0]].append(koristi)\n                if jedinica.trajanje != 2:\n                    model.add(koristi == 0)\n                else:\n                    model.add(blok == 10).only_enforce_if(koristi)\n'''
          assert old in t
          t = t.replace(old, new, 1)

          old = '''    for intervali in intervali_nastavnika.values():\n        model.add_no_overlap(intervali)\n'''
          new = '''    if ima_np_program:\n        model.add(sum(np_izbori["IV1"]) == 2)\n        model.add(sum(np_izbori["IV2"]) == 2)\n        model.add(sum(np_izbori["III1"]) + sum(np_izbori["III2"]) == 1)\n\n    for intervali in intervali_nastavnika.values():\n        model.add_no_overlap(intervali)\n'''
          assert old in t
          t = t.replace(old, new, 1)
          p.write_text(t, encoding='utf-8')

          p = Path('src/proveravac.py')
          t = p.read_text(encoding='utf-8')
          old = '''    _proveri_versku_i_gradjansko(ulaz, casovi, izvestaj)\n    _upozori_na_pauze_nastavnika(casovi, izvestaj)\n'''
          new = '''    _proveri_versku_i_gradjansko(ulaz, casovi, izvestaj)\n    _proveri_narodno_pozoriste(ulaz, casovi, izvestaj)\n    _upozori_na_pauze_nastavnika(casovi, izvestaj)\n'''
          assert old in t
          t = t.replace(old, new, 1)

          old = '''            izvestaj.greske.append(\n                f"{cas.gde}: наставник {cas.nastavnik} није доступан "\n                f"({cas.dan}, блокови {stavka.od_bloka}–{stavka.do_bloka})"\n            )\n\n    return tuple(zahtevi)\n'''
          new = '''            izvestaj.greske.append(\n                f"{cas.gde}: наставник {cas.nastavnik} није доступан "\n                f"({cas.dan}, блокови {stavka.od_bloka}–{stavka.do_bloka})"\n            )\n        if (\n            cas.korepetitor\n            and stavka.nastavnik == cas.korepetitor\n            and stavka.dan == cas.dan\n            and stavka.od_bloka <= cas.blok <= stavka.do_bloka\n        ):\n            izvestaj.greske.append(\n                f"{cas.gde}: корепетитор {cas.korepetitor} није доступан "\n                f"({cas.dan}, блокови {stavka.od_bloka}–{stavka.do_bloka})"\n            )\n\n    return tuple(zahtevi)\n'''
          assert old in t
          t = t.replace(old, new, 1)

          marker = 'def _proveri_smenu(\n'
          func = '''def _proveri_narodno_pozoriste(\n    ulaz: Ulaz, casovi: Sequence[Cas], izvestaj: Izvestaj\n) -> None:\n    ima_np_program = all(\n        any(\n            z.predmet == REPERTOAR_KLASICNOG and oznaka in z.odeljenja\n            for z in ulaz.zahtevi\n        )\n        for oznaka in ("IV1", "IV2")\n    )\n    if not ima_np_program:\n        return\n    np_casovi = [cas for cas in casovi if cas.prostorija == "NP-сала"]\n    po_odeljenju = Counter(\n        cas.odeljenja[0] for cas in np_casovi if len(cas.odeljenja) == 1\n    )\n    if po_odeljenju["IV1"] != 4:\n        izvestaj.greske.append(\n            f"NP-сала: IV1 мора имати 4 блока (два двочаса), има {po_odeljenju['IV1']}"\n        )\n    if po_odeljenju["IV2"] != 4:\n        izvestaj.greske.append(\n            f"NP-сала: IV2 мора имати 4 блока (два двочаса), има {po_odeljenju['IV2']}"\n        )\n    treci = po_odeljenju["III1"] + po_odeljenju["III2"]\n    if treci != 2:\n        izvestaj.greske.append(\n            f"NP-сала: III1 или III2 морају имати један двочас (2 блока), има {treci}"\n        )\n    if len(np_casovi) != 10:\n        izvestaj.greske.append(\n            f"NP-сала: потребно је укупно 10 блокова (5 двочаса), има {len(np_casovi)}"\n        )\n\n\n'''
          assert marker in t
          t = t.replace(marker, func + marker, 1)
          p.write_text(t, encoding='utf-8')

          Path('tests/test_pravila_resursa.py').write_text('''from pathlib import Path\n\nfrom src.resavac import NP_SALA, _moguce_prostorije, ucitaj_standardne_ulaze\n\n\ndef _zahtev(ulaz, predmet, odeljenje):\n    return next(z for z in ulaz.zahtevi if z.predmet == predmet and odeljenje in z.odeljenja)\n\n\ndef test_np_sala_samo_za_propisane_rkb_grupe():\n    ulaz, prostorije, _ = ucitaj_standardne_ulaze(Path("ulazi"))\n    iv1 = _zahtev(ulaz, "Репертоар класичног балета", "IV1")\n    i1 = _zahtev(ulaz, "Репертоар класичног балета", "I1")\n    assert NP_SALA in {p.oznaka for p in _moguce_prostorije(iv1, ulaz, prostorije)}\n    assert NP_SALA not in {p.oznaka for p in _moguce_prostorije(i1, ulaz, prostorije)}\n''', encoding='utf-8')
          PY
      - name: Pokreni testove
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q
      - name: Commituj izmene
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/resavac.py src/proveravac.py tests/test_pravila_resursa.py
          git commit -m "Primeni pravila korepetitora i Narodnog pozorista"
          git push origin HEAD:sync-google-sheet-2026-08-25
