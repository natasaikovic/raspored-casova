name: Primeni bez praznina jedna lokacija v2

on:
  push:
    branches:
      - sync-google-sheet-2026-08-25
    paths:
      - ".github/workflows/primeni-bez-praznina-jedna-lokacija-v2.yml"

permissions:
  contents: write

jobs:
  primeni:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Primeni dokazano pravilo
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/resavac.py')
          t = p.read_text(encoding='utf-8')
          old = '''            model.add(visak_lokacija >= sum(koristi_lokaciju) - 1)\n            model.add(sum(koristi_lokaciju) <= 2)\n            kazne.append(300 * visak_lokacija)\n'''
          new = '''            model.add(visak_lokacija >= sum(koristi_lokaciju) - 1)\n            model.add(sum(koristi_lokaciju) <= 2)\n            dve_lokacije = model.new_bool_var(f"{token}_d{indeks_dana}_dve_lokacije")\n            model.add(sum(koristi_lokaciju) == 2).only_enforce_if(dve_lokacije)\n            model.add(sum(koristi_lokaciju) <= 1).only_enforce_if(~dve_lokacije)\n            model.add(prazni == 0).only_enforce_if(~dve_lokacije)\n            kazne.append(300 * visak_lokacija)\n'''
          if old not in t:
              raise SystemExit('Nije pronadjeno A pravilo')
          t = t.replace(old, new, 1)
          old_b = '''                model.add(visak_lokacija_b >= sum(koristi_lokaciju_b) - 1)\n                model.add(sum(koristi_lokaciju_b) <= 2)\n                kazne.append(300 * visak_lokacija_b)\n'''
          new_b = '''                model.add(visak_lokacija_b >= sum(koristi_lokaciju_b) - 1)\n                model.add(sum(koristi_lokaciju_b) <= 2)\n                dve_lokacije_b = model.new_bool_var(f"{token}_d{indeks_dana}_dve_lokacije_b")\n                model.add(sum(koristi_lokaciju_b) == 2).only_enforce_if(dve_lokacije_b)\n                model.add(sum(koristi_lokaciju_b) <= 1).only_enforce_if(~dve_lokacije_b)\n                model.add(prazni_b == 0).only_enforce_if(~dve_lokacije_b)\n                kazne.append(300 * visak_lokacija_b)\n'''
          if old_b not in t:
              raise SystemExit('Nije pronadjeno B pravilo')
          p.write_text(t.replace(old_b, new_b, 1), encoding='utf-8')
          PY
      - name: Testovi
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q
      - name: Brza potvrda jedne nedelje
        run: |
          python - <<'PY'
          from ortools.sat.python import cp_model
          from src.model import Smena
          from src.resavac import napravi_model, ucitaj_standardne_ulaze
          ulaz, prostorije, nedostupnosti = ucitaj_standardne_ulaze('ulazi')
          model, _, _ = napravi_model(ulaz, prostorije, nedostupnosti, Smena.CRVENA, (), sa_nedeljom_b=False)
          model.clear_objective()
          solver = cp_model.CpSolver()
          solver.parameters.max_time_in_seconds = 240
          solver.parameters.num_search_workers = 8
          solver.parameters.random_seed = 1
          status = solver.solve(model)
          print('STATUS', solver.status_name(status), 'WALL', solver.wall_time)
          if status not in (cp_model.OPTIMAL, cp_model.FEASIBLE):
              raise SystemExit(1)
          PY
      - name: Commituj
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/resavac.py
          git commit -m "Zabrani prazne casove kada je odeljenje na jednoj lokaciji"
          git push origin HEAD:sync-google-sheet-2026-08-25