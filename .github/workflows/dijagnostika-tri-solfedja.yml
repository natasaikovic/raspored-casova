name: Dijagnostika tri solfedja

on:
  push:
    paths:
      - '.github/workflows/dijagnostika-tri-solfedja.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scenario:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        jutarnja: [crvena, plava]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Privremeno odvoji tri sporna Solfedja
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          p = Path('ulazi/osnovna_baletska_skola.csv')
          with p.open(encoding='utf-8-sig', newline='') as f:
              rows = list(csv.DictReader(f))
              fields = list(rows[0].keys())
          zamene = {'41': 'TEST СОЛФЕЂО 41', '42': 'TEST СОЛФЕЂО 42', '43': 'TEST СОЛФЕЂО 43'}
          for r in rows:
              if r['предмет'] == 'Солфеђо' and r['одељење'] in zamene:
                  r['наставник'] = zamene[r['одељење']]
          with p.open('w', encoding='utf-8', newline='') as f:
              w = csv.DictWriter(f, fieldnames=fields)
              w.writeheader(); w.writerows(rows)
          PY
      - name: Ujedini nastavnika i korepetitora u jedan fizicki resurs
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/resavac.py')
          t = p.read_text(encoding='utf-8')
          old = '''    for intervali in intervali_nastavnika.values():\n        model.add_no_overlap(intervali)\n    for intervali in intervali_korepetitora.values():\n        model.add_no_overlap(intervali)\n    for intervali in intervali_prostorija.values():\n        model.add_no_overlap(intervali)\n    if sa_nedeljom_b:\n        for intervali in intervali_nastavnika_b.values():\n            model.add_no_overlap(intervali)\n        for intervali in intervali_korepetitora_b.values():\n            model.add_no_overlap(intervali)\n        for intervali in intervali_prostorija_b.values():\n            model.add_no_overlap(intervali)\n'''
          new = '''    sve_osobe = set(intervali_nastavnika) | set(intervali_korepetitora)\n    for osoba in sve_osobe:\n        model.add_no_overlap(intervali_nastavnika.get(osoba, []) + intervali_korepetitora.get(osoba, []))\n    for intervali in intervali_prostorija.values():\n        model.add_no_overlap(intervali)\n    if sa_nedeljom_b:\n        sve_osobe_b = set(intervali_nastavnika_b) | set(intervali_korepetitora_b)\n        for osoba in sve_osobe_b:\n            model.add_no_overlap(intervali_nastavnika_b.get(osoba, []) + intervali_korepetitora_b.get(osoba, []))\n        for intervali in intervali_prostorija_b.values():\n            model.add_no_overlap(intervali)\n'''
          if old not in t:
              raise SystemExit('Nije pronadjen blok resursa')
          p.write_text(t.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Instaliraj
        run: python -m pip install -r requirements.txt
      - name: Proveri dopustivost
        env:
          JUTARNJA: ${{ matrix.jutarnja }}
        run: |
          python - <<'PY'
          import os
          from ortools.sat.python import cp_model
          from src.model import Smena
          from src.resavac import napravi_model, ucitaj_standardne_ulaze
          ulaz, prostorije, nedostupnosti = ucitaj_standardne_ulaze('ulazi')
          jutarnja = Smena.CRVENA if os.environ['JUTARNJA'] == 'crvena' else Smena.PLAVA
          model, _, _ = napravi_model(ulaz, prostorije, nedostupnosti, jutarnja, (), sa_nedeljom_b=False)
          model.clear_objective()
          solver = cp_model.CpSolver()
          solver.parameters.max_time_in_seconds = 240
          solver.parameters.num_search_workers = 8
          solver.parameters.random_seed = 1
          status = solver.solve(model)
          print(f"JUTARNJA={os.environ['JUTARNJA']}; STATUS={solver.status_name(status)}; WALL={solver.wall_time:.2f}s")
          if status == cp_model.INFEASIBLE:
              raise SystemExit(2)
          if status not in (cp_model.OPTIMAL, cp_model.FEASIBLE):
              raise SystemExit(3)
          PY
