name: Pokreni resavac sada

on:
  push:
    branches:
      - popravi-prikaz-i-stroge-pauze
    paths:
      - .github/workflows/run-solver-now.yml

jobs:
  generisi:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instaliraj zavisnosti
        run: python -m pip install -r requirements.txt
      - name: Generisi obe nedelje
        continue-on-error: true
        run: |
          mkdir -p izlaz
          set -o pipefail
          python -m src.resavac \
            --ulazi ulazi \
            --izlaz izlaz \
            --vremensko-ogranicenje 1800 \
            --broj-radnika 8 \
            --seme 1 \
            2>&1 | tee izlaz/solver.log
      - name: Napravi HTML pregled
        if: always()
        run: |
          if [ -f izlaz/nedelja_a.csv ] && [ -f izlaz/nedelja_b.csv ]; then
            python -m src.vizualizacija izlaz/nedelja_a.csv izlaz/nedelja_b.csv --izlaz izlaz/raspored.html
          fi
      - name: Sacuvaj rezultat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raspored-2026-27-sale
          path: izlaz/
          retention-days: 14
