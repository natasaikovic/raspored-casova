name: Uvedi pravila istorije za Dusana Ilijina

on:
  push:
    branches:
      - popravi-prikaz-i-stroge-pauze
    paths:
      - .github/workflows/run-solver-now.yml

permissions:
  contents: write

jobs:
  primeni:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: popravi-prikaz-i-stroge-pauze
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Primeni izmene
        run: python scripts/apply_dusan_istorija.py
      - name: Pokreni testove
        run: python -m pip install -r requirements.txt && python -m pytest
      - name: Commit izmene
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ulazi/ostali_casovi.csv src/resavac.py src/proveravac.py docs/pravila-rasporeda.md tests/test_dusan_ilijin.py
          git commit -m "Dodaj pravila istorije za Dusana Ilijina"
          git push origin HEAD:popravi-prikaz-i-stroge-pauze

# Ponovljeno nakon ispravke regresionog testa pauza.
