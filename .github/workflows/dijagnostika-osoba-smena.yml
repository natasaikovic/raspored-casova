name: Dijagnostika resursa osobe po smeni

on:
  push:
    paths:
      - '.github/workflows/dijagnostika-osoba-smena.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osoba-smena:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        osoba:
          - 'Ђорђина Убовић'
          - 'Јелена Михаиловић Красић'
          - 'Марија Цветковић'
          - 'Соња Пана Виријевић'
        jutarnja: [crvena, plava]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Dodaj jedinstven resurs samo za osobu
        env:
          OSOBA: ${{ matrix.osoba }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          p = Path('src/resavac.py')
          t = p.read_text(encoding='utf-8')
          needle = '''    for intervali in intervali_korepetitora.values():\n        model.add_no_overlap(intervali)\n    for intervali in intervali_prostorija.values():\n'''
          repl = '''    for intervali in intervali_korepetitora.values():\n        model.add_no_overlap(intervali)\n    osoba_dijagnostika = ''' + repr(os.environ['OSOBA']) + '''\n    model.add_no_overlap(\n        intervali_nastavnika.get(osoba_dijagnostika, [])\n        + intervali_korepetitora.get(osoba_dijagnostika, [])\n    )\n    for intervali in intervali_prostorija.values():\n'''
          if needle not in t:
              raise SystemExit('Nije pronadjen blok resursa')
          p.write_text(t.replace(needle, repl, 1), encoding='utf-8')
          PY
      - name: Instaliraj
        run: python -m pip install -r requirements.txt
      - name: Proveri dopustivost
        env:
          OSOBA: ${{ matrix.osoba }}
          JUTARNJA: ${{ matrix.jutarnja }}
        run: |
          python - <<'PY'
          import os
          from ortools.sat.python import cp_model
          from src.model import Smena
          from src.resavac import napravi_model, ucitaj_standardne_ulaze
          ulaz, prostorije, nedostupnosti = ucitaj_standardne_ulaze('ulazi')
          jutarnja = Smena.CRVENA if os.environ['JUTARNJA'] == 'crvena' else Smena.PLAVA
          model, _, _ = napravi_model(ulaz, prostorije, nedostupnosti, jutarnja, (), sa_nedeljom_b=False)
          model.clear_objective()
          solver = cp_model.CpSolver()
          solver.parameters.max_time_in_seconds = 90
          solver.parameters.num_search_workers = 8
          solver.parameters.random_seed = 1
          status = solver.solve(model)
          print(f"OSOBA={os.environ['OSOBA']}; JUTARNJA={os.environ['JUTARNJA']}; STATUS={solver.status_name(status)}; WALL={solver.wall_time:.2f}s")
          if status == cp_model.INFEASIBLE:
              raise SystemExit(2)
          if status not in (cp_model.OPTIMAL, cp_model.FEASIBLE):
              raise SystemExit(3)
          PY
