name: Dijagnostika jedinstvenog resursa osobe

on:
  push:
    paths:
      - '.github/workflows/dijagnostika-jedinstven-resurs-osobe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dijagnostika:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        scenario: [jedna, obe]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Ujedini nastavnički i korepetitorski resurs
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/resavac.py')
          t = p.read_text(encoding='utf-8')
          old = '''    for intervali in intervali_nastavnika.values():\n        model.add_no_overlap(intervali)\n    for intervali in intervali_korepetitora.values():\n        model.add_no_overlap(intervali)\n    for intervali in intervali_prostorija.values():\n        model.add_no_overlap(intervali)\n    if sa_nedeljom_b:\n        for intervali in intervali_nastavnika_b.values():\n            model.add_no_overlap(intervali)\n        for intervali in intervali_korepetitora_b.values():\n            model.add_no_overlap(intervali)\n        for intervali in intervali_prostorija_b.values():\n            model.add_no_overlap(intervali)\n'''
          new = '''    # Ista fizička osoba je jedan resurs bez obzira da li je u zahtevu\n    # navedena kao nastavnik ili kao korepetitor.\n    sve_osobe = set(intervali_nastavnika) | set(intervali_korepetitora)\n    for osoba in sve_osobe:\n        model.add_no_overlap(\n            intervali_nastavnika.get(osoba, [])\n            + intervali_korepetitora.get(osoba, [])\n        )\n    for intervali in intervali_prostorija.values():\n        model.add_no_overlap(intervali)\n    if sa_nedeljom_b:\n        sve_osobe_b = set(intervali_nastavnika_b) | set(intervali_korepetitora_b)\n        for osoba in sve_osobe_b:\n            model.add_no_overlap(\n                intervali_nastavnika_b.get(osoba, [])\n                + intervali_korepetitora_b.get(osoba, [])\n            )\n        for intervali in intervali_prostorija_b.values():\n            model.add_no_overlap(intervali)\n'''
          if old not in t:
              raise SystemExit('Nije pronadjen blok resursa')
          p.write_text(t.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Instaliraj
        run: python -m pip install -r requirements.txt
      - name: Proveri testove
        run: python -m pytest
      - name: Proveri dopustivost
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          python - <<'PY'
          import os
          from ortools.sat.python import cp_model
          from src.model import Smena
          from src.resavac import napravi_model, ucitaj_standardne_ulaze
          ulaz, prostorije, nedostupnosti = ucitaj_standardne_ulaze('ulazi')
          obe = os.environ['SCENARIO'] == 'obe'
          model, _, _ = napravi_model(
              ulaz, prostorije, nedostupnosti, Smena.CRVENA, (), sa_nedeljom_b=obe
          )
          model.clear_objective()
          solver = cp_model.CpSolver()
          solver.parameters.max_time_in_seconds = 420 if obe else 240
          solver.parameters.num_search_workers = 8
          solver.parameters.random_seed = 1
          status = solver.solve(model)
          print(f"SCENARIO={os.environ['SCENARIO']}; STATUS={solver.status_name(status)}; WALL={solver.wall_time:.2f}s")
          if status == cp_model.INFEASIBLE:
              raise SystemExit(2)
          if status not in (cp_model.OPTIMAL, cp_model.FEASIBLE):
              raise SystemExit(3)
          PY
