name: Dijagnostika tacni raspon

on:
  push:
    branches:
      - sync-google-sheet-2026-08-25
    paths:
      - ".github/workflows/dijagnostika-tacni-raspon.yml"

jobs:
  dijagnostika:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [jedna, obe]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dodaj tacan raspon i pravila praznina
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/resavac.py')
          t = p.read_text(encoding='utf-8')

          old = '''            for jedinica in stavke:\n                p = promenljive[jedinica.indeks]\n                model.add(prvi <= p.blok).only_enforce_if(p.po_danu[indeks_dana])\n                model.add(\n                    poslednji >= p.blok + jedinica.trajanje - 1\n                ).only_enforce_if(p.po_danu[indeks_dana])\n            zauzeto = sum(\n'''
          new = '''            prvi_kandidati = []\n            poslednji_kandidati = []\n            for jedinica in stavke:\n                p = promenljive[jedinica.indeks]\n                prisutan = p.po_danu[indeks_dana]\n                prvi_kandidat = model.new_int_var(1, 2 * len(BLOKOVI), f"{token}_d{indeks_dana}_prvi_j{jedinica.indeks}")\n                model.add(prvi_kandidat == p.blok).only_enforce_if(prisutan)\n                model.add(prvi_kandidat == p.blok + len(BLOKOVI)).only_enforce_if(~prisutan)\n                prvi_kandidati.append(prvi_kandidat)\n                poslednji_kandidat = model.new_int_var(-len(BLOKOVI), len(BLOKOVI), f"{token}_d{indeks_dana}_poslednji_j{jedinica.indeks}")\n                model.add(poslednji_kandidat == p.blok + jedinica.trajanje - 1).only_enforce_if(prisutan)\n                model.add(poslednji_kandidat == p.blok + jedinica.trajanje - 1 - len(BLOKOVI)).only_enforce_if(~prisutan)\n                poslednji_kandidati.append(poslednji_kandidat)\n            prvi_sirov = model.new_int_var(1, 2 * len(BLOKOVI), f"{token}_d{indeks_dana}_prvi_sirov")\n            poslednji_sirov = model.new_int_var(-len(BLOKOVI), len(BLOKOVI), f"{token}_d{indeks_dana}_poslednji_sirov")\n            model.add_min_equality(prvi_sirov, prvi_kandidati)\n            model.add_max_equality(poslednji_sirov, poslednji_kandidati)\n            model.add(prvi == prvi_sirov).only_enforce_if(ima_cas)\n            model.add(poslednji == poslednji_sirov).only_enforce_if(ima_cas)\n            zauzeto = sum(\n'''
          if old not in t:
              raise SystemExit('Nije pronadjen A raspon')
          t = t.replace(old, new, 1)

          old_b = '''                for jedinica in stavke:\n                    p = promenljive[jedinica.indeks]\n                    assert p.blok_b is not None and p.po_danu_b is not None\n                    model.add(prvi_b <= p.blok_b).only_enforce_if(\n                        p.po_danu_b[indeks_dana]\n                    )\n                    model.add(\n                        poslednji_b >= p.blok_b + jedinica.trajanje - 1\n                    ).only_enforce_if(p.po_danu_b[indeks_dana])\n                zauzeto_b = sum(\n'''
          new_b = '''                prvi_kandidati_b = []\n                poslednji_kandidati_b = []\n                for jedinica in stavke:\n                    p = promenljive[jedinica.indeks]\n                    assert p.blok_b is not None and p.po_danu_b is not None\n                    prisutan_b = p.po_danu_b[indeks_dana]\n                    prvi_kandidat_b = model.new_int_var(1, 2 * len(BLOKOVI), f"{token}_d{indeks_dana}_prvi_b_j{jedinica.indeks}")\n                    model.add(prvi_kandidat_b == p.blok_b).only_enforce_if(prisutan_b)\n                    model.add(prvi_kandidat_b == p.blok_b + len(BLOKOVI)).only_enforce_if(~prisutan_b)\n                    prvi_kandidati_b.append(prvi_kandidat_b)\n                    poslednji_kandidat_b = model.new_int_var(-len(BLOKOVI), len(BLOKOVI), f"{token}_d{indeks_dana}_poslednji_b_j{jedinica.indeks}")\n                    model.add(poslednji_kandidat_b == p.blok_b + jedinica.trajanje - 1).only_enforce_if(prisutan_b)\n                    model.add(poslednji_kandidat_b == p.blok_b + jedinica.trajanje - 1 - len(BLOKOVI)).only_enforce_if(~prisutan_b)\n                    poslednji_kandidati_b.append(poslednji_kandidat_b)\n                prvi_sirov_b = model.new_int_var(1, 2 * len(BLOKOVI), f"{token}_d{indeks_dana}_prvi_sirov_b")\n                poslednji_sirov_b = model.new_int_var(-len(BLOKOVI), len(BLOKOVI), f"{token}_d{indeks_dana}_poslednji_sirov_b")\n                model.add_min_equality(prvi_sirov_b, prvi_kandidati_b)\n                model.add_max_equality(poslednji_sirov_b, poslednji_kandidati_b)\n                model.add(prvi_b == prvi_sirov_b).only_enforce_if(ima_cas_b)\n                model.add(poslednji_b == poslednji_sirov_b).only_enforce_if(ima_cas_b)\n                zauzeto_b = sum(\n'''
          if old_b not in t:
              raise SystemExit('Nije pronadjen B raspon')
          t = t.replace(old_b, new_b, 1)

          old_loc = '''            model.add(visak_lokacija >= sum(koristi_lokaciju) - 1)\n            model.add(sum(koristi_lokaciju) <= 2)\n            kazne.append(300 * visak_lokacija)\n'''
          new_loc = '''            model.add(visak_lokacija >= sum(koristi_lokaciju) - 1)\n            model.add(sum(koristi_lokaciju) <= 2)\n            dve_lokacije = model.new_bool_var(f"{token}_d{indeks_dana}_dve_lokacije")\n            model.add(sum(koristi_lokaciju) == 2).only_enforce_if(dve_lokacije)\n            model.add(sum(koristi_lokaciju) <= 1).only_enforce_if(~dve_lokacije)\n            model.add(poslednji - prvi + 1 - zauzeto == 0).only_enforce_if(~dve_lokacije)\n            model.add(poslednji - prvi + 1 - zauzeto == 1).only_enforce_if(dve_lokacije)\n            kazne.append(300 * visak_lokacija)\n'''
          if old_loc not in t:
              raise SystemExit('Nije pronadjeno A pravilo lokacija')
          t = t.replace(old_loc, new_loc, 1)

          old_loc_b = '''                model.add(visak_lokacija_b >= sum(koristi_lokaciju_b) - 1)\n                model.add(sum(koristi_lokaciju_b) <= 2)\n                kazne.append(300 * visak_lokacija_b)\n'''
          new_loc_b = '''                model.add(visak_lokacija_b >= sum(koristi_lokaciju_b) - 1)\n                model.add(sum(koristi_lokaciju_b) <= 2)\n                dve_lokacije_b = model.new_bool_var(f"{token}_d{indeks_dana}_dve_lokacije_b")\n                model.add(sum(koristi_lokaciju_b) == 2).only_enforce_if(dve_lokacije_b)\n                model.add(sum(koristi_lokaciju_b) <= 1).only_enforce_if(~dve_lokacije_b)\n                model.add(poslednji_b - prvi_b + 1 - zauzeto_b == 0).only_enforce_if(~dve_lokacije_b)\n                model.add(poslednji_b - prvi_b + 1 - zauzeto_b == 1).only_enforce_if(dve_lokacije_b)\n                kazne.append(300 * visak_lokacija_b)\n'''
          if old_loc_b not in t:
              raise SystemExit('Nije pronadjeno B pravilo lokacija')
          t = t.replace(old_loc_b, new_loc_b, 1)
          p.write_text(t, encoding='utf-8')
          PY
      - name: Instaliraj
        run: python -m pip install -r requirements.txt
      - name: Resi scenario
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          python - <<'PY'
          import os
          from ortools.sat.python import cp_model
          from src.model import Smena
          from src.resavac import napravi_model, ucitaj_standardne_ulaze
          ulaz, prostorije, nedostupnosti = ucitaj_standardne_ulaze('ulazi')
          obe = os.environ['SCENARIO'] == 'obe'
          model, _, _ = napravi_model(ulaz, prostorije, nedostupnosti, Smena.CRVENA, (), sa_nedeljom_b=obe)
          model.clear_objective()
          solver = cp_model.CpSolver()
          solver.parameters.max_time_in_seconds = 480 if obe else 240
          solver.parameters.num_search_workers = 8
          solver.parameters.random_seed = 1
          status = solver.solve(model)
          print(f"SCENARIO={os.environ['SCENARIO']}; STATUS={solver.status_name(status)}; WALL={solver.wall_time:.2f}s")
          if status == cp_model.INFEASIBLE:
              raise SystemExit(2)
          if status not in (cp_model.OPTIMAL, cp_model.FEASIBLE):
              raise SystemExit(3)
          PY