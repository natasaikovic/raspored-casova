name: Primeni pravila sala za narodnu igru

on:
  push:
    branches:
      - popravi-prikaz-i-stroge-pauze
    paths:
      - .github/workflows/apply-room-rules.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: popravi-prikaz-i-stroge-pauze
      - name: Primeni izmene
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f"Nije pronađen očekivani blok: {label}")
              return text.replace(old, new, 1)

          # --- rešavač ---
          path = Path("src/resavac.py")
          text = path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              'REPERTOAR_KLASICNOG = "Репертоар класичног балета"\nNP_SALA = "NP-сала"',
              'REPERTOAR_KLASICNOG = "Репертоар класичног балета"\nNARODNA_IGRA_GLAVNI = "Народна игра – главни предмет"\nREPERTOAR_NARODNE = "Репертоар народне игре"\nSG_SALE = frozenset({"SG-1", "SG-2", "SG-3"})\nNP_SALA = "NP-сала"',
              "konstante rešavača",
          )
          text = replace_once(
              text,
              '    if zahtev.predmet == INFORMATIKA:\n        return tuple(p for p in prostorije if p.oznaka == "KM-уч1")\n    if zahtev.predmet == REPERTOAR_KLASICNOG and zahtev.odeljenja[0] in {',
              '    if zahtev.predmet == INFORMATIKA:\n        return tuple(p for p in prostorije if p.oznaka == "KM-уч1")\n    if zahtev.predmet in {NARODNA_IGRA_GLAVNI, REPERTOAR_NARODNE}:\n        return tuple(\n            p\n            for p in prostorije\n            if p.tip is TipProstorije.SALA\n            and p.lokacija == SPORTSKA_GIMNAZIJA\n            and p.oznaka in SG_SALE\n        )\n    if zahtev.predmet == REPERTOAR_KLASICNOG and zahtev.odeljenja[0] in {',
              "ograničenje lokacije narodnih igara",
          )
          marker = '\n\ndef _subota_dozvoljena(zahtev: Zahtev, ulaz: Ulaz) -> bool:'
          helper = '''\n\ndef _kazna_sala_narodne_igre(zahtev: Zahtev, oznaka: str) -> int:\n    """SG-1 je standard; SG-2/SG-3 su izuzetak, prvenstveno za IV5."""\n\n    if zahtev.predmet != NARODNA_IGRA_GLAVNI or oznaka == "SG-1":\n        return 0\n    if oznaka not in {"SG-2", "SG-3"}:\n        return 100_000\n    return 1_000 if zahtev.odeljenja == ("IV5",) else 10_000\n'''
          if "def _kazna_sala_narodne_igre" not in text:
              if marker not in text:
                  raise SystemExit("Nije pronađeno mesto za helper sale")
              text = text.replace(marker, helper + marker, 1)

          text = replace_once(
              text,
              '    izbori: dict[int, dict[str, cp_model.BoolVar]] = {}\n    intervali: dict[str, list[cp_model.IntervalVar]] = defaultdict(list)\n    fiksne = fiksne or {}',
              '    izbori: dict[int, dict[str, cp_model.BoolVar]] = {}\n    intervali: dict[str, list[cp_model.IntervalVar]] = defaultdict(list)\n    kazne: list[cp_model.LinearExprT] = []\n    fiksne = fiksne or {}',
              "kazne jedne nedelje",
          )
          text = replace_once(
              text,
              '            izbori[jedinica.indeks][prostorija.oznaka] = koristi\n            intervali[prostorija.oznaka].append(',
              '            izbori[jedinica.indeks][prostorija.oznaka] = koristi\n            kazna = _kazna_sala_narodne_igre(zahtev, prostorija.oznaka)\n            if kazna:\n                kazne.append(kazna * koristi)\n            intervali[prostorija.oznaka].append(',
              "penalizacija jedne nedelje",
          )
          text = replace_once(
              text,
              '    for stavke in intervali.values():\n        model.add_no_overlap(stavke)\n    solver = cp_model.CpSolver()',
              '    for stavke in intervali.values():\n        model.add_no_overlap(stavke)\n    if kazne:\n        model.minimize(sum(kazne))\n    solver = cp_model.CpSolver()',
              "cilj dodele jedne nedelje",
          )
          text = replace_once(
              text,
              '    intervali_a: dict[str, list[cp_model.IntervalVar]] = defaultdict(list)\n    intervali_b: dict[str, list[cp_model.IntervalVar]] = defaultdict(list)\n    for jedinica in jedinice:',
              '    intervali_a: dict[str, list[cp_model.IntervalVar]] = defaultdict(list)\n    intervali_b: dict[str, list[cp_model.IntervalVar]] = defaultdict(list)\n    kazne: list[cp_model.LinearExprT] = []\n    for jedinica in jedinice:',
              "kazne obe nedelje",
          )
          text = replace_once(
              text,
              '            izbori_a[jedinica.indeks][soba.oznaka] = koristi\n            intervali_a[soba.oznaka].append(model.new_optional_fixed_size_interval_var(',
              '            izbori_a[jedinica.indeks][soba.oznaka] = koristi\n            kazna = _kazna_sala_narodne_igre(zahtev, soba.oznaka)\n            if kazna:\n                kazne.append(kazna * koristi)\n            intervali_a[soba.oznaka].append(model.new_optional_fixed_size_interval_var(',
              "penalizacija A",
          )
          text = replace_once(
              text,
              '                izbori_b[jedinica.indeks][soba.oznaka] = koristi\n                intervali_b[soba.oznaka].append(model.new_optional_fixed_size_interval_var(',
              '                izbori_b[jedinica.indeks][soba.oznaka] = koristi\n                kazna = _kazna_sala_narodne_igre(zahtev, soba.oznaka)\n                if kazna:\n                    kazne.append(kazna * koristi)\n                intervali_b[soba.oznaka].append(model.new_optional_fixed_size_interval_var(',
              "penalizacija B",
          )
          text = replace_once(
              text,
              '    for stavke in intervali_b.values():\n        model.add_no_overlap(stavke)\n    solver = cp_model.CpSolver()',
              '    for stavke in intervali_b.values():\n        model.add_no_overlap(stavke)\n    if kazne:\n        model.minimize(sum(kazne))\n    solver = cp_model.CpSolver()',
              "cilj dodele obe nedelje",
          )
          path.write_text(text, encoding="utf-8")

          # --- proveravač ---
          path = Path("src/proveravac.py")
          text = path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              'REPERTOAR_KLASICNOG = "Репертоар класичног балета"\nKOREPETITOR_BR_1 = "корепетитор br.1"',
              'REPERTOAR_KLASICNOG = "Репертоар класичног балета"\nNARODNA_IGRA_GLAVNI = "Народна игра – главни предмет"\nREPERTOAR_NARODNE = "Репертоар народне игре"\nSG_SALE = frozenset({"SG-1", "SG-2", "SG-3"})\nKOREPETITOR_BR_1 = "корепетитор br.1"',
              "konstante proveravača",
          )
          text = replace_once(
              text,
              '        if cas.predmet == INFORMATIKA and cas.prostorija != "KM-уч1":\n            izvestaj.greske.append(\n                f"{cas.gde}: {INFORMATIKA} мора бити у просторији KM-уч1"\n            )\n        if cas.prostorija == "NP-сала":',
              '''        if cas.predmet == INFORMATIKA and cas.prostorija != "KM-уч1":\n            izvestaj.greske.append(\n                f"{cas.gde}: {INFORMATIKA} мора бити у просторији KM-уч1"\n            )\n        if cas.predmet in {NARODNA_IGRA_GLAVNI, REPERTOAR_NARODNE}:\n            if prostorija.lokacija != SPORTSKA_GIMNAZIJA:\n                izvestaj.greske.append(\n                    f"{cas.gde}: „{cas.predmet}“ мора бити у Спортској гимназији"\n                )\n            elif cas.prostorija not in SG_SALE:\n                izvestaj.greske.append(\n                    f"{cas.gde}: „{cas.predmet}“ мора бити у SG-1, SG-2 или SG-3"\n                )\n        if (\n            cas.predmet == NARODNA_IGRA_GLAVNI\n            and cas.prostorija in {"SG-2", "SG-3"}\n        ):\n            odeljenje = cas.odeljenja[0] if len(cas.odeljenja) == 1 else "?"\n            if odeljenje == "IV5":\n                izvestaj.upozorenja.append(\n                    f"{cas.gde}: {NARODNA_IGRA_GLAVNI} за IV5 користи "\n                    f"{cas.prostorija} као дозвољени изузетак; приоритет је SG-1"\n                )\n            else:\n                izvestaj.upozorenja.append(\n                    f"{cas.gde}: {NARODNA_IGRA_GLAVNI} за {odeljenje} користи "\n                    f"{cas.prostorija} као изузетак; ако је могуће, изузетак треба "\n                    "дати IV5, а остала одељења држати у SG-1"\n                )\n        if cas.prostorija == "NP-сала":''',
              "provera sale narodne igre",
          )
          path.write_text(text, encoding="utf-8")

          # --- regresioni testovi ---
          Path("tests/test_sale_narodna_igra.py").write_text(r'''from src.model import Odeljenje, Predmet, Prostorija, Skola, Smena, TipProstorije, Ulaz, Zahtev
          from src.proveravac import Cas, proveri
          from src.resavac import _moguce_prostorije


          GLAVNI = "Народна игра – главни предмет"
          REPERTOAR = "Репертоар народне игре"

          SALE = (
              Prostorija("KM-1", "Кнез Милетина 8", TipProstorije.SALA, None, ""),
              Prostorija("SG-1", "Спортска гимназија", TipProstorije.SALA, None, ""),
              Prostorija("SG-2", "Спортска гимназија", TipProstorije.SALA, None, ""),
              Prostorija("SG-3", "Спортска гимназија", TipProstorije.SALA, None, ""),
          )


          def _ulaz(predmet=GLAVNI, odeljenje="IV5"):
              zahtev = Zahtev(
                  predmet=predmet,
                  razred="IV",
                  odeljenja=(odeljenje,),
                  fond=2,
                  fond_korepeticije=0,
                  nastavnik="Маја",
                  korepetitor=None,
                  smena=Smena.CEO_DAN,
                  smena_opis=Smena.CEO_DAN.value,
                  red=2,
                  datoteka="test.csv",
              )
              return Ulaz(
                  (zahtev,),
                  {odeljenje: Odeljenje(odeljenje, "IV", Smena.CEO_DAN, Skola.SREDNJA)},
                  {predmet: Predmet(predmet, True, True)},
                  None,
              ), zahtev


          def _casovi(predmet, odeljenje, prostorija):
              return (
                  Cas("понедељак", 1, predmet, (odeljenje,), "Маја", None, prostorija, 2),
                  Cas("понедељак", 2, predmet, (odeljenje,), "Маја", None, prostorija, 3),
              )


          def test_resavac_oba_predmeta_ogranicava_na_sportsku_gimnaziju():
              for predmet in (GLAVNI, REPERTOAR):
                  ulaz, zahtev = _ulaz(predmet)
                  moguce = _moguce_prostorije(zahtev, ulaz, SALE)
                  assert {p.oznaka for p in moguce} == {"SG-1", "SG-2", "SG-3"}


          def test_proveravac_zabranjuje_narodnu_igru_van_sportske_gimnazije():
              for predmet in (GLAVNI, REPERTOAR):
                  ulaz, _ = _ulaz(predmet)
                  izvestaj = proveri(ulaz, SALE, (), _casovi(predmet, "IV5", "KM-1"))
                  assert any("мора бити у Спортској гимназији" in g for g in izvestaj.greske)


          def test_sg2_je_dozvoljeni_izuzetak_za_iv5():
              ulaz, _ = _ulaz(GLAVNI, "IV5")
              izvestaj = proveri(ulaz, SALE, (), _casovi(GLAVNI, "IV5", "SG-2"))
              assert izvestaj.ispravan, izvestaj.tekst()
              assert any("IV5" in u and "дозвољени изузетак" in u for u in izvestaj.upozorenja)


          def test_sg2_za_drugo_odeljenje_upozorava_da_prednost_ima_iv5():
              ulaz, _ = _ulaz(GLAVNI, "IV4")
              izvestaj = proveri(ulaz, SALE, (), _casovi(GLAVNI, "IV4", "SG-2"))
              assert izvestaj.ispravan, izvestaj.tekst()
              assert any("изузетак треба дати IV5" in u for u in izvestaj.upozorenja)
          '''.replace("          ", ""), encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/resavac.py src/proveravac.py tests/test_sale_narodna_igra.py
          if git diff --cached --quiet; then
            echo "Nema izmena za commit."
            exit 0
          fi
          git commit -m "Uvedi pravila sala za narodnu igru"
          git push origin HEAD:popravi-prikaz-i-stroge-pauze
