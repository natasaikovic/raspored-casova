name: Provera izvodljivosti posle Solfedja

on:
  push:
    branches: [sync-google-sheet-2026-08-25]
    paths:
      - .github/workflows/provera-izvodljivosti-posle-solfedja.yml

jobs:
  izvodljivost:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jutarnja: [crvena, plava]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Testovi
        run: python -m pytest -q
      - name: Proveri jednu smenu bez optimizacije
        env:
          JUTARNJA: ${{ matrix.jutarnja }}
        run: |
          python - <<'PY'
          import os
          from ortools.sat.python import cp_model
          from src.model import Smena
          from src.resavac import napravi_model, ucitaj_standardne_ulaze

          ulaz, prostorije, nedostupnosti = ucitaj_standardne_ulaze('ulazi')
          jutarnja = Smena.CRVENA if os.environ['JUTARNJA'] == 'crvena' else Smena.PLAVA
          model, _, jedinice = napravi_model(
              ulaz, prostorije, nedostupnosti, jutarnja, (), sa_nedeljom_b=False
          )
          model.clear_objective()
          solver = cp_model.CpSolver()
          solver.parameters.max_time_in_seconds = 300
          solver.parameters.num_search_workers = 8
          solver.parameters.random_seed = 1
          solver.parameters.stop_after_first_solution = True
          status = solver.solve(model)
          print(f'JUTARNJA={os.environ["JUTARNJA"]}; STATUS={solver.status_name(status)}; JEDINICA={len(jedinice)}; WALL={solver.wall_time:.2f}s')
          if status == cp_model.INFEASIBLE:
              raise SystemExit(2)
          if status not in (cp_model.OPTIMAL, cp_model.FEASIBLE):
              raise SystemExit(3)
          PY
