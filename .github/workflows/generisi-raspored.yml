name: Generisi raspored

on:
  push:
    paths:
      - "ulazi/**/*.csv"
      - "src/*.py"
      - ".github/workflows/generisi-raspored.yml"
  workflow_dispatch:

concurrency:
  group: generisi-raspored-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  generisi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instaliraj zavisnosti
        run: python -m pip install -r requirements.txt
      - name: Proveri ispravnost strogog modela
        run: |
          python - <<'PY'
          from src.model import Smena
          from src.resavac import napravi_model, ucitaj_standardne_ulaze
          ulaz, prostorije, nedostupnosti = ucitaj_standardne_ulaze('ulazi')
          model, _, _ = napravi_model(
              ulaz, prostorije, nedostupnosti, Smena.CRVENA, sa_nedeljom_b=False
          )
          greska = model.validate()
          if greska:
              raise SystemExit(greska)
          print('MODEL=ISPRAVAN')
          PY
      - name: Preuzmi hint iz poslednjeg uspešnog artefakta
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p izlaz .hint-artifact
          echo "HINT: tražim poslednji upotrebljiv artefakt raspored-2026-27 sa grane main." | tee izlaz/solver.log
          run_ids_file=".hint-artifact/run_ids.txt"
          if ! gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&status=success&per_page=100" \
            --jq '.workflow_runs[] | select(.path == ".github/workflows/generisi-raspored.yml") | .id' \
            > "${run_ids_file}"; then
            echo "HINT: lista uspešnih pokretanja nije dostupna; rešavač radi bez hinta." | tee -a izlaz/solver.log
            echo "HINT_FILE=" >> "${GITHUB_ENV}"
            exit 0
          fi
          mapfile -t run_ids < "${run_ids_file}"

          if [ "${#run_ids[@]}" -eq 0 ]; then
            echo "HINT: uspešan artefakt nije pronađen; rešavač radi bez hinta." | tee -a izlaz/solver.log
            echo "HINT_FILE=" >> "${GITHUB_ENV}"
            exit 0
          fi

          hint_file=""
          for run_id in "${run_ids[@]}"; do
            candidate_dir=".hint-artifact/${run_id}"
            mkdir -p "${candidate_dir}"
            echo "HINT: proveravam uspešan run ${run_id}." | tee -a izlaz/solver.log
            if ! gh run download "${run_id}" \
              --repo "${GITHUB_REPOSITORY}" \
              --name raspored-2026-27 \
              --dir "${candidate_dir}"; then
              echo "HINT: run ${run_id} nema dostupan ispravan artefakt; preskačem ga." | tee -a izlaz/solver.log
              continue
            fi

            hint_file="$(find "${candidate_dir}" -type f -name nedelja_a.csv -print -quit)"
            if [ -n "${hint_file}" ]; then
              echo "HINT: run ${run_id} sadrži ${hint_file}; koristiće se za topli start." | tee -a izlaz/solver.log
              break
            fi
            echo "HINT: run ${run_id} nema nedelja_a.csv; preskačem ga." | tee -a izlaz/solver.log
          done

          if [ -n "${hint_file}" ]; then
            echo "HINT_FILE=${hint_file}" >> "${GITHUB_ENV}"
          else
            echo "HINT_FILE=" >> "${GITHUB_ENV}"
            echo "HINT: nijedan pregledani uspešan run nema nedelja_a.csv; rešavač radi bez hinta." | tee -a izlaz/solver.log
          fi
      - name: Generisi obe nedelje
        id: solver
        continue-on-error: true
        run: |
          mkdir -p izlaz
          set -o pipefail
          hint_args=()
          if [ -n "${HINT_FILE:-}" ]; then
            if python -m src.resavac --help 2>&1 | grep -q -- "--hintovi"; then
              hint_args=(--hintovi "${HINT_FILE}")
              echo "HINT: fajl je prosleđen kroz --hintovi i koristiće se u fazi 1." | tee -a izlaz/solver.log
            else
              echo "HINT: trenutni src/resavac.py nema --hintovi; radi se bez hinta." | tee -a izlaz/solver.log
            fi
          else
            echo "HINT: solver se pokreće bez hinta." | tee -a izlaz/solver.log
          fi
          python -m src.resavac \
            --ulazi ulazi \
            --izlaz izlaz \
            --vremensko-ogranicenje 1800 \
            --broj-radnika 8 \
            --seme 1 \
            "${hint_args[@]}" \
            2>&1 | tee -a izlaz/solver.log
      - name: Napravi HTML pregled
        if: always()
        run: |
          mkdir -p izlaz
          if [ -f izlaz/nedelja_a.csv ] && [ -f izlaz/nedelja_b.csv ]; then
            python -m src.vizualizacija \
              izlaz/nedelja_a.csv izlaz/nedelja_b.csv \
              --izlaz izlaz/raspored.html
          else
            echo "CSV datoteke nisu napravljene." >> izlaz/solver.log
          fi
      - name: Rezime rezultata
        if: always()
        run: |
          echo "=== DATOTEKE ==="
          find izlaz -maxdepth 1 -type f -printf '%f %s bytes\n' | sort || true
          echo "=== POSLEDNJIH 120 LINIJA SOLVERA ==="
          tail -n 120 izlaz/solver.log || true
      - name: Proveri da li su obe nedelje napravljene
        if: always()
        run: |
          nedostaju=()
          [ -f izlaz/nedelja_a.csv ] || nedostaju+=("izlaz/nedelja_a.csv")
          [ -f izlaz/nedelja_b.csv ] || nedostaju+=("izlaz/nedelja_b.csv")
          if [ "${#nedostaju[@]}" -gt 0 ]; then
            echo "Nedostaju obavezni izlazi: ${nedostaju[*]}" | tee -a izlaz/solver.log
            exit 1
          fi
          echo "Oba nedeljna CSV izlaza su napravljena." | tee -a izlaz/solver.log
      - name: Sacuvaj rezultat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raspored-2026-27
          path: izlaz/
          if-no-files-found: warn
          retention-days: 14

# Duži run posle pravila za peti cas Solfedja: UNKNOWN u brzoj proveri vise ne zaustavlja glavni solver.
