name: Duboka dijagnostika rasporeda

on:
  push:
    branches:
      - sync-google-sheet-2026-08-25
    paths:
      - ".github/workflows/dijagnostika-duboka.yml"

permissions:
  contents: read

jobs:
  scenario:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [bez, sve]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Resi scenario
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          python - <<'PY'
          import os
          from src.resavac import ucitaj_standardne_ulaze, resi_obe_nedelje
          ulaz, prostorije, sve = ucitaj_standardne_ulaze('ulazi')
          s = os.environ['SCENARIO']
          nd = () if s == 'bez' else sve
          a,b = resi_obe_nedelje(ulaz, prostorije, nd, vremensko_ogranicenje=120, broj_radnika=8, seme=1, hintovi=())
          print(f'SCENARIO={s}; A={a.status}; B={b.status}; N={len(nd)}')
          if a.pronadjen:
              print(f'CASOVA_A={len(a.casovi)}; CILJ={a.cilj}; ISPRAVAN={a.izvestaj.ispravan if a.izvestaj else None}')
          PY
