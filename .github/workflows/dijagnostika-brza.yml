name: Brza dijagnostika rasporeda

on:
  push:
    branches:
      - sync-google-sheet-2026-08-25
    paths:
      - ".github/workflows/dijagnostika-brza.yml"

permissions:
  contents: read

jobs:
  brza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Proveri slojeve ogranicenja
        run: |
          python - <<'PY'
          from src.resavac import ucitaj_standardne_ulaze, resi_obe_nedelje
          ulaz, prostorije, sve = ucitaj_standardne_ulaze('ulazi')
          grupe = [
              ('BEZ', ()),
              ('SUBOTA', tuple(x for x in sve if x.dan == 'субота')),
              ('PON-PET', tuple(x for x in sve if x.dan != 'субота')),
              ('SVE', sve),
          ]
          for naziv, nd in grupe:
              a,b=resi_obe_nedelje(ulaz,prostorije,nd,vremensko_ogranicenje=20,broj_radnika=8,seme=1,hintovi=())
              print(f'{naziv}: {a.status} / {b.status} ({len(nd)})', flush=True)
          PY
