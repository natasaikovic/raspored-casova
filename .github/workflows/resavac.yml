name: Rešavač rasporeda

on:
  workflow_dispatch:
  push:
    paths:
      - "ulazi/**/*.csv"
      - "src/*.py"
      - ".github/workflows/resavac.yml"
  pull_request:
    paths:
      - "ulazi/**/*.csv"
      - "src/*.py"
      - ".github/workflows/resavac.yml"

permissions:
  contents: read

jobs:
  dijagnostika:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [jedna-bez, jedna-sve, obe-bez, obe-sve]

    steps:
      - name: Preuzmi repozitorijum
        uses: actions/checkout@v4

      - name: Postavi Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instaliraj zavisnosti
        run: python -m pip install -r requirements.txt

      - name: Proveri čistu dopustivost
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          python - <<'PY'
          import os
          from ortools.sat.python import cp_model
          from src.model import Smena
          from src.resavac import napravi_model, ucitaj_standardne_ulaze

          ulaz, prostorije, sve = ucitaj_standardne_ulaze("ulazi")
          scenario = os.environ["SCENARIO"]
          sa_nedeljom_b = scenario.startswith("obe-")
          nedostupnosti = () if scenario.endswith("-bez") else sve

          model, _, _ = napravi_model(
              ulaz,
              prostorije,
              nedostupnosti,
              Smena.CRVENA,
              (),
              sa_nedeljom_b=sa_nedeljom_b,
          )
          # Za dijagnostiku tražimo bilo koje dopustivo rešenje, bez optimizacije.
          model.clear_objective()
          solver = cp_model.CpSolver()
          solver.parameters.max_time_in_seconds = 120
          solver.parameters.num_search_workers = 8
          solver.parameters.random_seed = 1
          status = solver.solve(model)
          print(
              f"SCENARIO={scenario}; STATUS={solver.status_name(status)}; "
              f"NEDOSTUPNOSTI={len(nedostupnosti)}; "
              f"WALL={solver.wall_time:.2f}s"
          )
          PY
