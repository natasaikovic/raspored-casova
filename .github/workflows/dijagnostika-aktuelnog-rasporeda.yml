name: Dijagnostika aktuelnog rasporeda

on:
  push:
    paths:
      - '.github/workflows/dijagnostika-aktuelnog-rasporeda.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  raspored:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instaliraj
        run: python -m pip install -r requirements.txt
      - name: Pokreni rešavač
        run: |
          rm -rf artifact
          python -m src.resavac \
            --izlaz artifact \
            --vremensko-ogranicenje 600 \
            --broj-radnika 8 \
            --seme 1 \
            --bez-hintova
      - name: Proveri nedelju A
        if: always()
        run: |
          if [ -f artifact/nedelja_a.csv ]; then
            python -m src.proveravac artifact/nedelja_a.csv --jutarnja-smena crvena
          else
            echo 'Nema artifact/nedelja_a.csv'
            exit 1
          fi
      - name: Proveri nedelju B
        if: always()
        run: |
          if [ -f artifact/nedelja_b.csv ]; then
            python -m src.proveravac artifact/nedelja_b.csv --jutarnja-smena plava
          else
            echo 'Nema artifact/nedelja_b.csv'
            exit 1
          fi
      - name: Sačuvaj raspored
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dijagnostika-raspored
          path: artifact/
          if-no-files-found: warn
          retention-days: 7
