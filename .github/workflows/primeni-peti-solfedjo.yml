name: Primeni peti cas Solfedja

on:
  push:
    branches: [sync-google-sheet-2026-08-25]
    paths:
      - .github/workflows/primeni-peti-solfedjo.yml

permissions:
  contents: write

jobs:
  primeni:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync-google-sheet-2026-08-25
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Primeni pravila
        run: |
          python - <<'PY'
          from pathlib import Path

          Path('src/izuzeci.py').write_text('''"""Uski, eksplicitno odobreni izuzeci od opstih pravila rasporeda."""\n\nSOLFEDJO_PETI_CAS = frozenset({\n    ("Марија Цветковић", "41"),\n    ("Соња Пана Виријевић", "42"),\n    ("Јелена Михаиловић Красић", "43"),\n})\n\n\ndef dozvoljen_peti_cas_solfedja(predmet: str, nastavnik: str, odeljenja) -> bool:\n    """Samo tri odobrena casa Solfedja smeju u peti blok jutarnje smene."""\n    return (\n        predmet == "Солфеђо"\n        and len(odeljenja) == 1\n        and (nastavnik, odeljenja[0]) in SOLFEDJO_PETI_CAS\n    )\n''', encoding='utf-8')

          p = Path('src/resavac.py')
          t = p.read_text(encoding='utf-8')
          needle = 'from .loader import ucitaj_nedostupnost, ucitaj_prostorije, ucitaj_vise\n'
          if 'from .izuzeci import dozvoljen_peti_cas_solfedja' not in t:
              t = t.replace(needle, needle + 'from .izuzeci import dozvoljen_peti_cas_solfedja\n', 1)
          old = '''    if zahtev.smena in (Smena.CRVENA, Smena.PLAVA):\n        blokovi = PRVA_SMENA if zahtev.smena is jutarnja_smena else DRUGA_SMENA\n'''
          new = '''    if zahtev.smena in (Smena.CRVENA, Smena.PLAVA):\n        if zahtev.smena is jutarnja_smena:\n            blokovi = PRVA_SMENA\n            if dozvoljen_peti_cas_solfedja(\n                zahtev.predmet, zahtev.nastavnik, zahtev.odeljenja\n            ):\n                blokovi = PRVA_SMENA + (5,)\n        else:\n            blokovi = DRUGA_SMENA\n'''
          if old not in t: raise SystemExit('Nije pronadjeno pravilo smene u resavac.py')
          t = t.replace(old, new, 1)
          old = '''    for intervali in intervali_nastavnika.values():\n        model.add_no_overlap(intervali)\n    for intervali in intervali_korepetitora.values():\n        model.add_no_overlap(intervali)\n    for intervali in intervali_prostorija.values():\n        model.add_no_overlap(intervali)\n    if sa_nedeljom_b:\n        for intervali in intervali_nastavnika_b.values():\n            model.add_no_overlap(intervali)\n        for intervali in intervali_korepetitora_b.values():\n            model.add_no_overlap(intervali)\n        for intervali in intervali_prostorija_b.values():\n            model.add_no_overlap(intervali)\n'''
          new = '''    # Ista fizicka osoba je jedan resurs bez obzira na ulogu nastavnika\n    # ili korepetitora.\n    for osoba in sorted(set(intervali_nastavnika) | set(intervali_korepetitora)):\n        model.add_no_overlap(\n            intervali_nastavnika.get(osoba, [])\n            + intervali_korepetitora.get(osoba, [])\n        )\n    for intervali in intervali_prostorija.values():\n        model.add_no_overlap(intervali)\n    if sa_nedeljom_b:\n        for osoba in sorted(set(intervali_nastavnika_b) | set(intervali_korepetitora_b)):\n            model.add_no_overlap(\n                intervali_nastavnika_b.get(osoba, [])\n                + intervali_korepetitora_b.get(osoba, [])\n            )\n        for intervali in intervali_prostorija_b.values():\n            model.add_no_overlap(intervali)\n'''
          if old not in t: raise SystemExit('Nije pronadjen blok NoOverlap u resavac.py')
          p.write_text(t.replace(old, new, 1), encoding='utf-8')

          p = Path('src/proveravac.py')
          t = p.read_text(encoding='utf-8')
          needle = 'from .loader import (\n'
          if 'from .izuzeci import dozvoljen_peti_cas_solfedja' not in t:
              t = t.replace(needle, 'from .izuzeci import dozvoljen_peti_cas_solfedja\n' + needle, 1)
          old = '''    if smena in (Smena.CRVENA, Smena.PLAVA):\n        dozvoljeni = PRVA_SMENA if smena is jutarnja else DRUGA_SMENA\n'''
          new = '''    if smena in (Smena.CRVENA, Smena.PLAVA):\n        if smena is jutarnja:\n            dozvoljeni = PRVA_SMENA\n            if dozvoljen_peti_cas_solfedja(\n                cas.predmet, cas.nastavnik, cas.odeljenja\n            ):\n                dozvoljeni = PRVA_SMENA + (5,)\n        else:\n            dozvoljeni = DRUGA_SMENA\n'''
          if old not in t: raise SystemExit('Nije pronadjeno pravilo smene u proveravac.py')
          t = t.replace(old, new, 1)
          old = '''    _prijavi_duple_resurse(\n        casovi,\n        "наставник",\n        lambda c: (c.termin, c.nastavnik),\n        lambda c: c.nastavnik,\n        izvestaj,\n    )\n    _prijavi_duple_resurse(\n        casovi,\n        "просторија",\n        lambda c: (c.termin, c.prostorija),\n        lambda c: c.prostorija,\n        izvestaj,\n    )\n    _prijavi_duple_resurse(\n        [c for c in casovi if c.korepetitor],\n        "корепетитор",\n        lambda c: (c.termin, c.korepetitor),\n        lambda c: c.korepetitor,\n        izvestaj,\n    )\n'''
          new = '''    # Nastavnik i korepetitor su isti fizicki resurs.\n    zauzeca_osoba: dict[tuple[tuple[str, int], str], list[Cas]] = defaultdict(list)\n    for cas in casovi:\n        zauzeca_osoba[(cas.termin, cas.nastavnik)].append(cas)\n        if cas.korepetitor:\n            zauzeca_osoba[(cas.termin, cas.korepetitor)].append(cas)\n    for ((dan, blok), osoba), stavke in zauzeca_osoba.items():\n        if len(stavke) <= 1:\n            continue\n        redovi = ", ".join(str(c.red) for c in stavke)\n        izvestaj.greske.append(\n            f"особа {osoba} је заузета више пута: {dan}, блок {blok}, редови {redovi}"\n        )\n    _prijavi_duple_resurse(\n        casovi,\n        "просторија",\n        lambda c: (c.termin, c.prostorija),\n        lambda c: c.prostorija,\n        izvestaj,\n    )\n'''
          if old not in t: raise SystemExit('Nije pronadjena provera resursa u proveravac.py')
          p.write_text(t.replace(old, new, 1), encoding='utf-8')

          Path('tests/test_peti_solfedjo.py').write_text('''from pathlib import Path\n\nfrom src.izuzeci import dozvoljen_peti_cas_solfedja\nfrom src.model import Smena\nfrom src.proveravac import Cas, Izvestaj, _proveri_smenu\nfrom src.resavac import _dozvoljeni_poceci, ucitaj_standardne_ulaze\n\n\ndef _zahtev(ulaz, nastavnik, odeljenje):\n    return next(z for z in ulaz.zahtevi if z.predmet == "Солфеђо" and z.nastavnik == nastavnik and odeljenje in z.odeljenja)\n\n\ndef test_peti_cas_samo_za_tri_odobrena_solfedja():\n    assert dozvoljen_peti_cas_solfedja("Солфеђо", "Марија Цветковић", ("41",))\n    assert dozvoljen_peti_cas_solfedja("Солфеђо", "Соња Пана Виријевић", ("42",))\n    assert dozvoljen_peti_cas_solfedja("Солфеђо", "Јелена Михаиловић Красић", ("43",))\n    assert not dozvoljen_peti_cas_solfedja("Солфеђо", "Ђорђина Убовић", ("31",))\n    assert not dozvoljen_peti_cas_solfedja("Класичан балет", "Марија Цветковић", ("41",))\n\n\ndef test_solver_dozvoljava_blok_5_samo_kad_je_ta_smena_jutarnja():\n    ulaz, _, nedostupnosti = ucitaj_standardne_ulaze(Path("ulazi"))\n    marija = _zahtev(ulaz, "Марија Цветковић", "41")\n    assert any(blok == 5 for _, blok in _dozvoljeni_poceci(marija, 1, Smena.CRVENA, nedostupnosti))\n    assert all(blok != 5 for _, blok in _dozvoljeni_poceci(marija, 1, Smena.PLAVA, nedostupnosti))\n\n\ndef test_proveravac_prihvata_peti_cas_odobrenog_solfedja():\n    ulaz, _, _ = ucitaj_standardne_ulaze(Path("ulazi"))\n    zahtev = _zahtev(ulaz, "Марија Цветковић", "41")\n    cas = Cas("понедељак", 5, "Солфеђо", ("41",), "Марија Цветковић", None, "KM-уч2", 2)\n    izvestaj = Izvestaj()\n    _proveri_smenu(cas, zahtev, Smena.CRVENA, izvestaj)\n    assert not izvestaj.greske\n''', encoding='utf-8')

          p = Path('tests/test_proveravac.py')
          t = p.read_text(encoding='utf-8')
          t = t.replace('assert any("наставник Мила је заузет више пута" in g for g in izvestaj.greske)', 'assert any("особа Мила је заузета више пута" in g for g in izvestaj.greske)')
          p.write_text(t, encoding='utf-8')

          docs = Path('docs/pravila-rasporeda.md')
          tekst = docs.read_text(encoding='utf-8')
          dodatak = '''\n- Izuzetak za peti cas jutarnje smene: samo Solfedjo 41 kod Marije Cvetkovic, Solfedjo 42 kod Sonje Pane Virijevic i Solfedjo 43 kod Jelene Mihailovic Krasic sme da bude u bloku 5 (11:40-12:25) kada je njihova smena jutarnja. Ovaj izuzetak ne vazi ni za jedan drugi predmet, nastavnika ili odeljenje.\n- Ista fizicka osoba je jedan rasporedni resurs bez obzira da li u konkretnom casu nastupa kao nastavnik ili korepetitor; ne sme istovremeno obavljati obe uloge na razlicitim casovima.\n'''
          if 'Izuzetak za peti cas jutarnje smene' not in tekst:
              docs.write_text(tekst.rstrip() + '\n' + dodatak, encoding='utf-8')
          PY
      - name: Instaliraj zavisnosti
        run: python -m pip install -r requirements.txt
      - name: Pokreni testove
        run: python -m pytest -q
      - name: Commituj stvarnu izmenu i ukloni jednokratni workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/primeni-peti-solfedjo.yml
          git add -A
          git commit -m "Dozvoli peti cas za tri Solfedja"
          git push origin HEAD:sync-google-sheet-2026-08-25
