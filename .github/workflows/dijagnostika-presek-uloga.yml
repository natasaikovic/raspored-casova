name: Dijagnostika preseka uloga

on:
  push:
    paths:
      - '.github/workflows/dijagnostika-presek-uloga.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  presek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instaliraj
        run: python -m pip install -r requirements.txt
      - name: Prikaži osobe u obe uloge
        run: |
          python - <<'PY'
          from collections import defaultdict
          from src.resavac import ucitaj_standardne_ulaze

          ulaz, _, _ = ucitaj_standardne_ulaze('ulazi')
          kao_nastavnik = defaultdict(int)
          kao_korepetitor = defaultdict(int)
          redovi_n = defaultdict(list)
          redovi_k = defaultdict(list)
          for z in ulaz.zahtevi:
              kao_nastavnik[z.nastavnik] += z.fond
              redovi_n[z.nastavnik].append((z.gde, z.predmet, z.fond, z.odeljenja))
              if z.korepetitor and z.fond_korepeticije:
                  kao_korepetitor[z.korepetitor] += z.fond_korepeticije
                  redovi_k[z.korepetitor].append((z.gde, z.predmet, z.fond_korepeticije, z.odeljenja))

          presek = sorted(set(kao_nastavnik) & set(kao_korepetitor))
          print(f'BROJ OSOBA U OBE ULOGE: {len(presek)}')
          for ime in presek:
              print(f'OSOBA: {ime}; nastavnik={kao_nastavnik[ime]}; korepetitor={kao_korepetitor[ime]}; ukupno={kao_nastavnik[ime] + kao_korepetitor[ime]}')
              for r in redovi_n[ime]: print('  N:', r)
              for r in redovi_k[ime]: print('  K:', r)
          PY
